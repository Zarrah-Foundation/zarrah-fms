{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Forgot Password" %} - {% trans "Zarrah Foundation" %}{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-16">
  <div class="card">
    <h1 class="mb-6 text-2xl font-bold text-emerald-800">{% trans "Forgot Password" %}</h1>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% for field in form %}
      <div>
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
      </div>
      {% endfor %}
      <button type="submit" class="btn-primary w-full">{% trans "Send Reset Link" %}</button>
    </form>
  </div>
</div>
{% endblock %}
