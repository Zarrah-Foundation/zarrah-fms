{% load i18n %}

<div class="mx-auto mb-16 max-w-3xl text-center">

    {% if badge %}
    <span
        class="inline-flex items-center rounded-full bg-primary/10 px-5 py-2 text-sm font-semibold text-primary">

        {{ badge }}

    </span>
    {% endif %}

    <h2 class="mt-6 text-4xl font-extrabold tracking-tight text-slate-900 lg:text-5xl">

        {{ title }}

    </h2>

    {% if subtitle %}
    <p class="mx-auto mt-6 max-w-2xl text-lg leading-8 text-slate-600">

        {{ subtitle }}

    </p>
    {% endif %}

</div>
