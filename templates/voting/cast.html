{% extends "base.html" %}
{% load i18n %}

{% block title %}{{ vote.title }} - {% trans "Vote" %}{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg px-4 py-12">
  <div class="card">
    <h1 class="mb-4 text-2xl font-bold text-emerald-800">{{ vote.title }}</h1>
    {% if vote.description %}<p class="mb-6 text-gray-600">{{ vote.description }}</p>{% endif %}
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% for option in vote.options %}
      <label class="flex items-center gap-3 rounded-lg border p-4 hover:bg-gray-50 cursor-pointer">
        <input type="radio" name="option_id" value="{{ option.id }}" required>
        <span>{{ option.label }}</span>
      </label>
      {% endfor %}
      <button type="submit" class="btn-primary w-full">{% trans "Submit Vote" %}</button>
    </form>
  </div>
</div>
{% endblock %}
